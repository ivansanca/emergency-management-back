name: Dependency Check

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Analizar vulnerabilidades de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Restaurar caché de la base de datos NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      - name: Ejecutar OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DossindexAnalyzerEnabled=false
          -DfailBuildOnCVSS=7

      - name: Publicar informe de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 14