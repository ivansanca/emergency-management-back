
name: Dependency Check

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  dependency-check:
    name: Analizar vulnerabilidades de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn --batch-mode --no-transfer-progress clean
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DfailBuildOnCVSS=11

      - name: Publicar informe de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 14
