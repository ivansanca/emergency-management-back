spring.application.name=emergency-management

# Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=
spring.neo4j.authentication.password=

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

# Kafka consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=emergency-management
spring.kafka.consumer.auto-offset-reset=earliest

server.port=8080

# API errors as Problem Details (RFC 9457)
spring.mvc.problemdetails.enabled=true

# Decision engine
app.decision.max-distance-km=60.0
app.decision.max-travel-time-minutes=60.0

# Grouping of automatic detections (satellites, sensors) into incidents.
# A detection joins an open incident of the same type with a detection closer
# than the radius of its type and within the window. Types without a radius
# are never grouped; manual reports always open their own incident.
app.grouping.radius-meters[FOREST_FIRE]=2000
app.grouping.radius-meters[STRUCTURE_FIRE]=100
app.grouping.window=PT24H